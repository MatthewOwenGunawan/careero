<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careero Sign Up</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<div class="login-container">

    <div class="left-panel">

        <div class="illustration-box">
            <img src="asset/computer.jpg" alt="Sign Up">
        </div>

        <h2>Launch your dream career</h2>

        <p>
            Start your journey towards a better professional life with expert guidance.
        </p>

    </div>

    <div class="right-panel">

        <div class="form-wrapper align-left">

            <h1>Create account</h1>

            <p class="subtitle">
                Start your journey towards a better professional life.
            </p>

            <form id="registerForm">

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="fullname" required>
                </div>

                <div class="input-group">
                    <label>Email address</label>
                    <input type="email" id="registerEmail" required>
                </div>

                <div class="input-group">
                    <label>Password</label>

                    <div class="password-wrapper">
                        <input type="password" id="registerPassword" required>

                        <i class="fa-solid fa-eye" id="togglePasswordSignup"></i>
                    </div>

                </div>

                <button type="submit" class="btn-signup">
                    Create account
                </button>

            </form>

            <div class="divider">
                <span>OR SIGN UP WITH</span>
            </div>

            <div class="sso-buttons">

                <button type="button" class="btn-sso" onclick="signupGoogle()">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo">
                </button>

                <button type="button" class="btn-sso" onclick="signupGithub()">
                    <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub Logo">
                </button>

            </div>

            <div class="footer-links center-text">
                <p>
                    Have an account?
                    <a href="index.html">Log in</a>
                </p>
            </div>

        </div>

    </div>

</div>

<script>
    const input = document.getElementById("registerPassword");
    const icon = document.getElementById("togglePasswordSignup");

    if (input && icon) {
        icon.addEventListener("click", () => {
            const isHidden = input.type === "password";
            input.type = isHidden ? "text" : "password";

            icon.classList.toggle("fa-eye");
            icon.classList.toggle("fa-eye-slash");
        });
    }
</script>

<script type="module" src="signup.js"></script>

</body>
</html>
