<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careero Forgot Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="left-panel forgot-panel">
            <div class="logo-left">
                <div class="logo-icon"><i class="fa-solid fa-briefcase"></i></div>
                <span>Careero</span>
            </div>
            <div class="illustration-box transparent-img">
                <img src="https://via.placeholder.com/350x350/E8D6B8/333?text=Gambar+Berpikir" alt="Forgot Password Illustration">
            </div>
        </div>

        <div class="right-panel">
            <div class="form-wrapper align-left">
                <h1>Forgot password?</h1>
                <p class="subtitle forgot-sub">Don't worry, it happens to the best of us. Enter your email and we'll send you a link to reset it.</p>

                <form action="#">
                    <div class="input-group">
                        <label>Email address</label>
                        <input type="email" placeholder="name@company.com" required>
                    </div>

                    <button type="submit" class="btn-signin">Send Reset Link &rarr;</button>
                </form>

                <div class="footer-links center-text mt-20">
                    <a href="index.html" class="return-login">&larr; Return to Login</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
